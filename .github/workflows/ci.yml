name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    # PostgreSQL para el test de integración de la API (app.int.spec.ts)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitalia
          POSTGRES_PASSWORD: vitalia
          POSTGRES_DB: vitalia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalia -d vitalia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://vitalia:vitalia@localhost:5432/vitalia_test

    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Calcula base/head para `nx affected` (último commit verde de la rama base)
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx format:check
      # Headers del firmware (contratos + vectores GCM) sincronizados con @vitalia/contracts
      - run: pnpm fw:codegen --check
      # Constantes de la app del paciente (contratos + marca) sincronizadas
      - run: pnpm app:codegen --check
      - run: pnpm nx affected -t lint test build --parallel=3

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run api:gateway-e2e-install:ci
      - run: pnpm gateway:up
      - run: pnpm gateway:seed
      - run: pnpm sim:wearables --gateway --count=2 --duration=8
      - run: pnpm gateway:verify
      - run: pnpm gateway:operations
      - run: pnpm gateway:smoke
      - if: always()
        run: pnpm gateway:down

  # Firmware del wearable (PlatformIO). Corre solo si cambió el firmware o los
  # contratos que implementa; si no, termina en segundos (ADR 0010).
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wearable-firmware-poc

    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            firmware:
              - 'apps/wearable-firmware-poc/**'
              - 'libs/shared/contracts/**'
              - '.github/workflows/ci.yml'

      - if: steps.changes.outputs.firmware == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - if: steps.changes.outputs.firmware == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('apps/wearable-firmware-poc/platformio.ini') }}

      - if: steps.changes.outputs.firmware == 'true'
        # Misma versión que en las máquinas del equipo: la CI tiene que compilar y testear igual.
        run: pip install platformio==6.1.19

      # secrets.h no se versiona: en CI se compila con la plantilla
      - if: steps.changes.outputs.firmware == 'true'
        run: cp src/secrets.h.example src/secrets.h

      - if: steps.changes.outputs.firmware == 'true'
        run: pio run

      # Tests de las libs puras (telemetry, fall_detection, envelope) en el runner
      - if: steps.changes.outputs.firmware == 'true'
        run: pio test -e native

      # Tests de la placa (lib/crypto con los vectores GCM): sin placa solo se compilan
      - if: steps.changes.outputs.firmware == 'true'
        run: pio test -e esp32-c3-supermini --without-uploading --without-testing

  patient-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient-app

    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            app:
              - 'apps/patient-app/**'
              - '.github/workflows/ci.yml'

      - if: steps.changes.outputs.app == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: steps.changes.outputs.app == 'true'
        # Misma versión que en las máquinas del equipo
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - if: steps.changes.outputs.app == 'true'
        run: flutter pub get

      - if: steps.changes.outputs.app == 'true'
        run: flutter analyze

      - if: steps.changes.outputs.app == 'true'
        run: flutter test

      # APK instalable (firmado con la clave de depuración, sin tiendas: tesis 4.2). La dirección
      # del gateway se puede fijar con la variable del repo VITALIA_GATEWAY_URL; si no, la de la
      # VLAN de pacientes de la guía. En la app se cambia desde Ajustes.
      - if: steps.changes.outputs.app == 'true'
        run: flutter build apk --release --dart-define=VITALIA_API_URL=${{ vars.VITALIA_GATEWAY_URL || 'http://10.0.20.1:8080' }}

      - if: steps.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitalia-paciente-apk
          path: apps/patient-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
