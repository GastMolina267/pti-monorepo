name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    # PostgreSQL para el test de integración de la API (app.int.spec.ts)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitalia
          POSTGRES_PASSWORD: vitalia
          POSTGRES_DB: vitalia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalia -d vitalia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://vitalia:vitalia@localhost:5432/vitalia_test

    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Calcula base/head para `nx affected` (último commit verde de la rama base)
      - uses: nrwl/nx-set-shas@v4

      - run: pnpm nx format:check
      - run: pnpm nx affected -t lint test build --parallel=3
