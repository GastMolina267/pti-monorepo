# Dos orígenes: las apps conservan sus URLs absolutas sin prefijos ni cambios de build.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/backoffice;
    include /etc/nginx/includes/vitalia-proxy.conf;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/tv;
    include /etc/nginx/includes/vitalia-proxy.conf;
    location / { try_files $uri $uri/ /index.html; }
}
