# Landing pública (ADR 0020): sitio estático aparte del gateway, sin /api ni /socket.io.
server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/landing;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / { try_files $uri $uri/ /index.html; }
}
