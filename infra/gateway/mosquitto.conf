# Gateway de software: identidades separadas para API, health y cada pulsera.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/auth/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
max_inflight_messages 40
max_queued_messages 2000
