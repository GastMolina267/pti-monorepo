# Eclipse Mosquitto 2 — broker MQTT del Edge Gateway (VLAN 10 → puerto 1883).
# DESARROLLO: acceso anónimo habilitado. En la Fase 4 se agrega password_file
# y ACL por wearable (ver docs/04-contratos.md y docs/07-roadmap.md):
#   usuario = código del wearable (wb-<NN>-<mac>), contraseña con mosquitto_passwd
#   cargada a mano en el secrets.h de cada pulsera; ACL con %u:
#     pattern write hospital/+/wearable/%u/data
#     pattern read  hospital/+/wearable/%u/cmd

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Mensajes QoS 1 en vuelo/encolados por cliente (50 pulseras cada 3 s, §11.1.4)
max_inflight_messages 40
max_queued_messages 2000
