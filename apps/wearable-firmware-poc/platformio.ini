[platformio]
; `pio run` compila solo la placa; `native` es para los tests sin hardware.
default_envs = esp32-c3-supermini

[env:esp32-c3-supermini]
platform = espressif32@7.1.0  ; Arduino Core ESP32 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; CRÍTICO: sin esto no hay salida por el monitor serie.
; La SuperMini no tiene chip USB-serie: usa USB CDC nativo.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    ; Las libs de lib/ también ven los headers generados de include/ (vitalia_contracts.h)
    -I include

build_unflags = -std=gnu++11

; Los tests native no corren en la placa.
test_ignore = native/*

; Versiones exactas (sin ^): estas librerías rompen compatibilidad seguido y la CI
; tiene que compilar siempre lo mismo. Para actualizar, cambiar la versión acá a mano.
; BusIO es dependencia transitiva de las Adafruit, pero se fija igual.
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
    adafruit/Adafruit MLX90614 Library@2.1.6
    adafruit/Adafruit MPU6050@2.2.9
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3

; Tests de la lógica pura (lib/telemetry, lib/fall_detection) en la PC: `pnpm fw:test`.
; Necesita gcc/g++ en el PATH (en Windows, MSYS2 o MinGW).
[env:native]
platform = native@1.2.1
build_flags = -std=gnu++17 -I include
test_filter = native/*
; Las libs de hardware dependen de Arduino: no se compilan acá.
lib_ignore = sensors, net, ui
lib_deps =
    bblanchon/ArduinoJson@7.4.3
